function load(){try{D=JSON.parse(localStorage.getItem(K))}catch(e){D=null}if(!D)D={};migrate()}
function migrate(){delete D.pin;Object.keys(M).concat(['evid']).forEach(k=>D[k]=D[k]||[]);D.days=D.days||{};D.gm.forEach(o=>{const g=GMOLD[o.actividad];if(g){o.actividad=g[0];o.categoria=g[1]}});if((D.gmv||0)<3){if(D.gm.length)SEED.gm.forEach(x=>{if(!D.gm.some(o=>o.actividad===x.actividad))D.gm.push(Object.assign({},x,{id:uid(),creado:today(),estado:'pendiente'}))});D.gmv=3}if(D.caja===undefined)D.caja=3000;if(D.reserva===undefined)D.reserva=0;D.v=2}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('No se pudo guardar. Descarga un respaldo en la pestaña Respaldo.')}}

function cfg(k,v){D[k]=+v||0;save();render()}
function add(e,id){e.preventDefault();const m=M[id],o=Object.fromEntries(new FormData(e.target));m.f.forEach(f=>{if(f[2]==='n')o[f[0]]=+o[f[0]]||0});o.id=uid();o.creado=today();if(m.st)o[m.sf||'estado']=m.st[0];D[id].push(o);save();render();return false}
function upd(id,i,f,v){const o=D[id].find(x=>x.id===i);if(!o)return;if(typeof o[f]==='number')v=+v||0;if(id==='events'&&f==='fecha'){o.orig=o.orig||o.fecha;o.estado='reprogramada'}o[f]=v;save();render();if(CEL.includes(v))toast(ALEGRIA[Math.floor(Math.random()*ALEGRIA.length)])}
function del(id,i){if(confirm('¿Eliminar este registro?')){D[id]=D[id].filter(x=>x.id!==i);save();render()}}
function seed(id){const m=M[id],n=m.f[0][0];SEED[id].forEach(s=>{if(!D[id].some(o=>o[n]===s[n]))D[id].push(Object.assign({},s,{id:uid(),creado:today(),[m.sf||'estado']:m.st[0]}))});save();render()}
function loadHor(){const d=today();HOR.forEach(h=>{if(!D.events.some(e=>e.fecha===d&&e.inicio===h[0]&&e.titulo===h[2]))D.events.push({id:uid(),fecha:d,inicio:h[0],fin:h[1],titulo:h[2],prioridad:'media',estado:'pendiente',creado:d})});save();render()}
function saveDay(e,w){e.preventDefault();const d=today();D.days[d]=D.days[d]||{};D.days[d][w]=Object.fromEntries(new FormData(e.target));save();render();return false}

function row(id,m,o){const sf=m.sf||'estado',n=m.f[0][0];
 const sm=m.f.slice(1).filter(f=>f[2]!=='a'&&o[f[0]]!==''&&o[f[0]]!=null&&o[f[0]]!==0).map(f=>`${f[1]}: ${esc(o[f[0]])}`).join(' · ');
 const nt=m.f.filter(f=>f[2]==='a'&&o[f[0]]).map(f=>`<p class="m">${esc(o[f[0]])}</p>`).join('');
 return `<div class="c"><div class="row"><span><b class="${['completada','lograda'].includes(o[sf])?'done':''}">${esc(o[n])}</b><br><small>${sm}</small></span><button class="x" style="flex:0" onclick="del('${id}','${o.id}')">Eliminar</button></div>${nt}${m.st?`<select onchange="upd('${id}','${o.id}','${sf}',this.value)">${opts(m.st,o[sf])}</select>`:''}${m.r?m.r(o):''}</div>`}
function sect(id){const m=M[id],a=D[id];
 const inp=f=>{const n=f[0],t=f[2],x=f[3],v=t==='d'?(x===undefined?today():x):(x===undefined?'':x);
  return `<label class="fl">${f[1]}${t==='s'?`<select name="${n}">${opts(x)}</select>`:t==='a'?`<textarea name="${n}" rows="2"></textarea>`:`<input name="${n}" type="${{t:'text',n:'number',d:'date',h:'time'}[t]}" value="${esc(v)}" ${t==='n'?'step="any"':''}>`}</label>`};
 const l=m.L?m.L(a):(m.rev?a.slice().reverse():m.o?a.slice().sort(m.o):a).map(o=>row(id,m,o)).join('')||'<p class="m">Aún no hay registros.</p>';
 return `<h2>${m.t}</h2>${m.x?m.x(a):''}<details><summary>Agregar</summary><form onsubmit="return add(event,'${id}')"><div class="row">${m.f.map(inp).join('')}</div><button class="pri">Guardar</button></form></details>${l}`}

function dia(){const d=today(),dd=D.days[d]||{},ini=dd.ini||{},cie=dd.cierre||{};
 const ts=D.tasks.filter(t=>t.estado!=='completada'&&(!t.fecha||t.fecha<=d)),ev=D.events.filter(e=>e.fecha===d).sort((a,b)=>a.inicio.localeCompare(b.inicio)),vs=D.sales.filter(s=>s.fecha===d);
 const pe=D.gm.filter(g=>['evidencia pendiente','evidencia preparada'].includes(g.estado)).length+D.evid.filter(x=>['realizada','evidencia preparada'].includes(x.estado)).length;
 const q=(arr,v,p)=>arr.map((t,i)=>`<label class="fl">${t}<textarea name="${p}${i}" rows="2">${esc(v[p+i])}</textarea></label>`).join('');
 const pr=[0,1,2].map(i=>ini['p'+i]).filter(Boolean);
 return `<p class="m">${new Date().toLocaleDateString('es-MX',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'})}</p>
 ${foco(pr,ev)}${rachaHtml()}${linea()}${areasHtml()}
 <div class="kpi"><div><b>${daysLeft()}</b><span>días al 12 de noviembre</span></div><div><b>${money(sum(vs,s=>s.cant*s.precio))}</b><span>ventas de hoy (brutas)</span></div><div><b>${D.clientes.filter(c=>c.creado===d).length}/5</b><span>contactos nuevos hoy</span></div><div><b>${pe}</b><span>evidencias por enviar</span></div><div><b>${lp()}%</b><span>Carta de logros</span></div></div>
 
 <details ${dd.ini?'':'open'}><summary>Comenzar mi día ${dd.ini?'(guardado)':''}</summary><form onsubmit="return saveDay(event,'ini')"><label class="fl">Tres prioridades de hoy<input name="p0" value="${esc(ini.p0)}"><input name="p1" value="${esc(ini.p1)}"><input name="p2" value="${esc(ini.p2)}"></label>${q(INI,ini,'q')}<button class="pri">Guardar inicio</button></form></details>
 <h2>Agenda de hoy</h2>${ev.length?ev.map(e=>`<div class="c row"><span><b>${esc(e.inicio)}–${esc(e.fin)}</b> <span class="${e.estado==='completada'?'done':''}">${esc(e.titulo)}</span></span><select onchange="upd('events','${e.id}','estado',this.value)">${opts(ES,e.estado)}</select></div>`).join(''):'<p class="m">No hay actividades hoy. Cárgalas en Agenda.</p>'}
 <h2>Tareas pendientes</h2>${ts.length?ts.map(t=>`<div class="c"><label><input type="checkbox" style="width:auto" onchange="upd('tasks','${t.id}','estado','completada')"> ${esc(t.titulo)} <small>${esc(t.area)}${t.fecha&&t.fecha<d?' · <span class="late">vencida</span>':''}</small></label></div>`).join(''):'<p class="m">Sin tareas pendientes para hoy.</p>'}
 <details ${dd.cierre?'':''}><summary>Cerrar mi día ${dd.cierre?'(guardado)':''}</summary><form onsubmit="return saveDay(event,'cierre')">${q(CIE,cie,'c')}<button class="pri">Guardar cierre</button></form></details>`}

function informe(){const g=D.gm,gr=g.filter(o=>GMS.indexOf(o.estado)>=2&&GMS.indexOf(o.estado)<=6).length,tv=sum(D.sales,s=>s.cant*s.precio);
 return `<h2>Informe al ${today()}</h2><div class="kpi"><div><b>${daysLeft()}</b><span>días al 12 de noviembre</span></div><div><b>${D.metas.length?Math.round(sum(D.metas,pct)/D.metas.length):0}%</b><span>avance de metas</span></div><div><b>${D.tasks.filter(t=>t.estado==='completada').length}/${D.tasks.length}</b><span>tareas completadas</span></div><div><b>${lp()}%</b><span>Carta de logros</span></div><div><b>${gr}/${g.length}</b><span>Gimnasio Mental realizadas</span></div><div><b>${g.filter(o=>o.estado==='evidencia aceptada').length}</b><span>evidencias aceptadas</span></div><div><b>${money(tv)}</b><span>ventas brutas · ${sum(D.sales,s=>s.cant)} ensaladas</span></div><div><b>${Object.values(D.days).filter(x=>x.ini).length}/${Object.values(D.days).filter(x=>x.cierre).length}</b><span>días con inicio / cierre</span></div></div>
 ${graficas()}<h2>Metas</h2>${D.metas.map(o=>`<div class="c"><b>${esc(o.nombre)}</b><progress max="100" value="${pct(o)}"></progress><small>${pct(o)}% · ${esc(o.estado)}</small></div>`).join('')||'<p class="m">Carga tus metas en la pestaña Metas.</p>'}

function resp(){return `<h2>Respaldo</h2><p class="m">Tus datos viven solo en este navegador y dispositivo. Descarga un respaldo seguido, sobre todo antes de limpiar el navegador.</p><button class="pri" onclick="exp()">Descargar respaldo</button><h2>Restaurar</h2><input type="file" accept=".json,application/json" onchange="imp(this.files[0])"><p class="m">Restaurar reemplaza los datos actuales por los del archivo.</p>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='reencauzar-respaldo-'+today()+'.json';a.click()}

const mp=a=>{const l=D.metas.filter(o=>o.area===a);return l.length?sum(l,pct)/l.length:null};
const avg=v=>{v=v.filter(x=>x!=null);return v.length?Math.round(sum(v,x=>x)/v.length):0};
const logP=m=>{const l=D.logros.filter(o=>o.meta===m);return l.length?l.filter(o=>o.estado==='completada').length/l.length*100:null};
const AR=[['Salud','💪','salud',()=>avg([mp('Salud'),logP('Meta 1')])],['Tizoc','🥗','tizoc',()=>avg([mp('Tizoc')])],['Marca','🎬','marca',()=>avg([mp('Marca personal'),logP('Meta 2'),D.videos.length?D.videos.filter(v=>v.etapa==='publicado').length/3*100:null])],['Dinero','💰','dinero',()=>avg([mp('Economía')])],['Familia','❤️','vida',()=>avg([mp('Familia')])],['Gimnasio','🧠','gm',()=>D.gm.length?Math.round(D.gm.filter(o=>GMS.indexOf(o.estado)>=2&&GMS.indexOf(o.estado)<=6).length/D.gm.length*100):0],['Equipo','👥','vida',()=>avg([mp('Equipo')])],['Lectura','📖','vida',()=>avg([mp('Lectura')])]];
function racha(){let n=0,d=today();if(!(D.days[d]||{}).cierre)d=addD(d,-1);while((D.days[d]||{}).cierre){n++;d=addD(d,-1)}return n}
function insignias(){const s=racha(),ds=Object.values(D.days);return [['🌅','Primer día',ds.some(x=>x.ini)],['🌙','Día cerrado',ds.some(x=>x.cierre)],['🔥','Racha de 3 días',s>=3],['🛒','Primer pedido',D.sales.length>0],['✅','10 tareas hechas',D.tasks.filter(t=>t.estado==='completada').length>=10],['💪','5 sesiones',D.salud.filter(o=>o.actividad&&o.actividad!=='ninguna').length>=5],['🎬','Primer video',D.videos.some(v=>v.etapa==='publicado')],['🏆','Meta concretada',D.metas.some(o=>o.estado==='lograda')||LM.some(g=>{const l=D.logros.filter(o=>o.meta===g.id);return l.length>0&&l.every(o=>o.estado==='completada')})],['📈','50% de avance',ov()>=50]]}
function rachaHtml(){const s=racha();return `<div class="racha"><div class="fire"><b>${s}</b><span>${s===1?'día':'días'} de racha</span></div><div class="bd">${insignias().map(x=>`<span class="${x[2]?'on':''}">${x[0]}<small>${x[1]}</small></span>`).join('')}</div></div>`}
function foco(pr,ev){const nx=ev.find(e=>e.estado==='pendiente'||e.estado==='en progreso');return `<div class="foco"><b>Lo más importante de hoy</b>${pr.length?`<ol>${pr.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>`:'<p>Define tus 3 prioridades en "Comenzar mi día".</p>'}${nx?`<small>Siguiente: ${esc(nx.inicio)} · ${esc(nx.titulo)}</small>`:''}</div>`}
function linea(){const t=today();let h='';for(let i=1;i<=12;i++){const d='2026-11-'+String(i).padStart(2,'0'),H={3:'🎬',6:'🎬',10:'🎬',12:'🏁'}[i],dd=D.days[d]||{},c=d<t?(dd.cierre?'ok':'miss'):d===t?'now':'';h+=`<div class="dy ${c}"><b>${i}</b><span>${H||(dd.cierre?'✓':'·')}</span></div>`}return `<h2>Mi camino al 12 de noviembre</h2><div class="tl">${h}</div><small>✓ día cerrado · 🎬 video · 🏁 evaluación</small>`}
function areasHtml(){return `<h2>Mis áreas</h2><div class="areas">${AR.map((a,i)=>{const p=a[3]();return `<button class="ar" style="--k:var(--c${i%5+1});--p:${p}" onclick="go('${a[2]}')"><span class="mini"><i>${p}%</i></span><span>${a[1]} ${a[0]}</span></button>`}).join('')}</div>`}
function bars(d,col,u){if(!d.length||d.every(x=>!x[1]))return '<p class="m">Sin datos aún. Captura registros para ver la gráfica.</p>';const mx=Math.max(...d.map(x=>x[1]))||1,W=300/d.length;return `<svg viewBox="0 0 300 130" class="ch" role="img">${d.map((x,i)=>{const h=Math.round(x[1]/mx*88),X=i*W+3,bw=W-6;return `<rect x="${X}" y="${105-h}" width="${bw}" height="${h}" rx="4" style="fill:var(${col})"/><text x="${X+bw/2}" y="${100-h}" text-anchor="middle" font-size="9" style="fill:var(--ink)">${x[1]?(u==='$'?Math.round(x[1]):+x[1].toFixed(1)):''}</text><text x="${X+bw/2}" y="122" text-anchor="middle" font-size="9" style="fill:var(--mut)">${x[0]}</text>`}).join('')}</svg>`}
function graficas(){const vd=[];for(let i=1;i<=12;i++){const d='2026-11-'+String(i).padStart(2,'0');vd.push([i,sum(D.sales.filter(s=>s.fecha===d),s=>s.cant*s.precio)])}
 const sd=D.salud.filter(o=>hrs(o)!=null).slice(-7).map(o=>[o.fecha.slice(8),hrs(o)]),act=D.deudas.filter(o=>o.estado!=='pagado'),pend=sum(act,o=>Math.max(0,o.importe-o.pagado)),libre=Math.max(0,D.caja-D.reserva);
 return `<h2>Ventas brutas por día</h2>${bars(vd,'--c2','$')}<h2>Horas de sueño (últimos 7 registros)</h2>${bars(sd,'--c4')}<h2>Avance por área (%)</h2>${bars(AR.map(a=>[a[1],a[3]()]),'--c1')}<h2>Dinero: libre, pendiente y brecha</h2>${bars([['Libre',libre],['Pendiente',pend],['Brecha',Math.max(0,pend-libre)]],'--c3','$')}`}
const FRASES=['Transforma tu mente. Transforma tu vida. Construye tu futuro.','Hoy hago lo que realmente me acerca a la vida que quiero construir.','Soy un hombre saludable y peso 79 kg.','Tengo una marca personal activa en redes sociales y economía.'];
const CEL=['completada','lograda','evidencia aceptada','publicado','Pagado','pagado','cumplido'];
const ALEGRIA=['¡Bien hecho, César! Un paso más hacia tu meta.','¡Eso es disciplina! Sigue así.','¡Cumplido! Así se construye tu futuro.','¡Otro logro! Estás en tu plataforma y vas por tus metas.'];
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function ov(){const v=[];if(D.metas.length)v.push(sum(D.metas,pct)/D.metas.length);if(D.logros.length)v.push(lp());if(D.gm.length)v.push(D.gm.filter(o=>GMS.indexOf(o.estado)>=2&&GMS.indexOf(o.estado)<=6).length/D.gm.length*100);return v.length?Math.round(sum(v,x=>x)/v.length):0}
function render(){const t=TABS.find(x=>x[0]===tab);
 const b=tab==='dia'?dia():tab==='informe'?informe():tab==='resp'?resp():t[2].map(sect).join('');
 $('#app').innerHTML=`<header><div class="hero"><div><b>REENCAUZAR</b><p>${FRASES[new Date(today()+'T12:00:00').getDate()%FRASES.length]}</p><small>${daysLeft()} días para el 12 de noviembre</small></div><div class="ring" style="--p:${ov()}" title="Avance general"><span>${ov()}%</span></div></div></header><main>${b}</main><nav>${TABS.map(x=>`<button class="${x[0]===tab?'on':''}" onclick="go('${x[0]}')"><i>${x[1].split(' ')[0]}</i>${x[1].slice(x[1].indexOf(' ')+1)}</button>`).join('')}</nav>`}
load();render();
</script>
